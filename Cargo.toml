[package]
name = "mcp-regress"
version = "0.4.0"
edition = "2021"
license = "MIT"
description = "Deterministic MCP server regression checks for CI"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "signal"] }
tempfile = "3"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
