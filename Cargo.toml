[package]
name = "mcp-regress"
version = "0.8.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Deterministic MCP server regression checks for CI"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "signal"] }
tempfile = "3"
sha2 = "0.11"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
processkit = "3.3.4"
